name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Build with Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          arguments: build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Package
          path: build/libs

      - name: Upload common artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crittersandcompanions-common-1.21.1.jar
          path: common/build/libs

      - name: Upload NeoForge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crittersandcompanions-neoforge-1.21.1.jar
          path: neoforge/build/libs

      - name: Upload Fabric artifacts
        uses: actions/upload-artifact@v4
        with:
          name: crittersandcompanions-fabric-1.21.1.jar
          path: fabric/build/libs